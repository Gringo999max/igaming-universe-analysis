<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iGaming Regulatory Heatmap — Global</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0e1a;
  color: #e0e0e0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  padding: 20px;
  min-height: 100vh;
}
h1 {
  text-align: center;
  font-size: 24px;
  background: linear-gradient(135deg, #00e5ff, #7c4dff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 5px;
}
.subtitle {
  text-align: center;
  font-size: 12px;
  opacity: 0.5;
  margin-bottom: 25px;
}
.legend-bar {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 25px;
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.legend-badge {
  width: 14px;
  height: 14px;
  border-radius: 3px;
  flex-shrink: 0;
}
.filter-tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.filter-tab {
  padding: 6px 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  cursor: pointer;
  font-size: 12px;
  color: #aaa;
  transition: all 0.2s;
}
.filter-tab:hover { border-color: #00e5ff; color: #00e5ff; }
.filter-tab.active {
  background: rgba(0, 229, 255, 0.15);
  border-color: #00e5ff;
  color: #00e5ff;
}
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-bottom: 25px;
  flex-wrap: wrap;
}
.stat-box {
  text-align: center;
  padding: 12px 20px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  min-width: 120px;
}
.stat-number { font-size: 28px; font-weight: 700; }
.stat-label {
  font-size: 11px;
  opacity: 0.5;
  margin-top: 2px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 12px;
  max-width: 1400px;
  margin: 0 auto;
}
.country-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 16px 18px;
  transition: all 0.3s;
  cursor: default;
  position: relative;
  overflow: hidden;
}
.country-card:hover {
  border-color: rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.06);
  transform: translateY(-2px);
}
.country-card .bar {
  position: absolute;
  top: 0; left: 0;
  width: 4px;
  height: 100%;
  border-radius: 10px 0 0 10px;
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.card-country { font-size: 16px; font-weight: 700; }
.card-flag { font-size: 22px; }
.card-status {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 600;
}
.card-details {
  font-size: 12px;
  line-height: 1.7;
  opacity: 0.8;
}
.card-detail-row {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  padding: 2px 0;
}
.card-detail-label { opacity: 0.5; }
.card-detail-value { font-weight: 600; text-align: right; max-width: 60%; }
.card-notes {
  margin-top: 8px;
  font-size: 11px;
  opacity: 0.6;
  font-style: italic;
  line-height: 1.5;
}
.spribe-badge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  margin-top: 6px;
  font-weight: 600;
}
</style>
</head>

const statusLabels = {
  fully_regulated: "Fully Regulated",
  regulated_restrictions: "Regulated (Restrictions)",
  grey_market: "Grey Market",
  blocked: "Blocked",
  emerging: "Emerging"
};
const statusColors = {
  fully_regulated: "#4caf50",
  regulated_restrictions: "#ff9800",
  grey_market: "#ffd600",
  blocked: "#ef5350",
  emerging: "#42a5f5"
};
const statusBg = {
  fully_regulated: "rgba(76,175,80,0.2)",
  regulated_restrictions: "rgba(255,152,0,0.2)",
  grey_market: "rgba(255,214,0,0.2)",
  blocked: "rgba(239,83,80,0.2)",
  emerging: "rgba(66,165,245,0.2)"
};
const spribeLabels = {
  high: "Spribe Key Market",
  medium: "Spribe Active",
  low: "Spribe Minor",
  blocked: "Spribe Blocked"
};
const spribeColors = {
  high: "#00e5ff",
  medium: "#ff9800",
  low: "#888",
  blocked: "#ef5350"
};

function renderStats() {
  const counts = {};
  countries.forEach(function(c) {
    counts[c.status] = (counts[c.status] || 0) + 1;
  });
  var bar = document.getElementById("stats-bar");
  var html = "";
  Object.keys(counts).forEach(function(status) {
    html += '<div class="stat-box"><div class="stat-number" style="color:' +
      statusColors[status] + '">' + counts[status] +
      '</div><div class="stat-label">' + statusLabels[status] + '</div></div>';
  });
  html += '<div class="stat-box"><div class="stat-number" style="color:#00e5ff">' +
    countries.length + '</div><div class="stat-label">Total Markets</div></div>';
  bar.appendChild(document.createRange().createContextualFragment(html));
}

function renderFilters() {
  var container = document.getElementById("filter-tabs");
  var filters = [
    {key:"all", label:"All Markets"},
    {key:"fully_regulated", label:"Fully Regulated"},
    {key:"regulated_restrictions", label:"Restrictions"},
    {key:"grey_market", label:"Grey Market"},
    {key:"blocked", label:"Blocked"},
    {key:"emerging", label:"Emerging"},
    {key:"spribe_key", label:"Spribe Key Markets"}
  ];
  filters.forEach(function(f) {
    var tab = document.createElement("div");
    tab.className = "filter-tab" + (f.key === "all" ? " active" : "");
    tab.dataset.filter = f.key;
    tab.textContent = f.label;
    tab.addEventListener("click", function() {
      container.querySelectorAll(".filter-tab").forEach(function(t) {
        t.classList.remove("active");
      });
      tab.classList.add("active");
      renderGrid(f.key);
    });
    container.appendChild(tab);
  });
}

function createDetailRow(label, value) {
  var row = document.createElement("div");
  row.className = "card-detail-row";
  var lbl = document.createElement("span");
  lbl.className = "card-detail-label";
  lbl.textContent = label;
  var val = document.createElement("span");
  val.className = "card-detail-value";
  val.textContent = value;
  row.appendChild(lbl);
  row.appendChild(val);
  return row;
}

function renderGrid(filter) {
  var grid = document.getElementById("grid");
  grid.replaceChildren();
  var filtered = countries;
  if (filter && filter !== "all") {
    if (filter === "spribe_key") {
      filtered = countries.filter(function(c) { return c.spribe === "high"; });
    } else {
      filtered = countries.filter(function(c) { return c.status === filter; });
    }
  }

  filtered.forEach(function(c) {
    var card = document.createElement("div");
    card.className = "country-card";

    var bar = document.createElement("div");
    bar.className = "bar";
    bar.style.background = statusColors[c.status];
    card.appendChild(bar);

    var header = document.createElement("div");
    header.className = "card-header";
    var left = document.createElement("div");
    var flagSpan = document.createElement("span");
    flagSpan.className = "card-flag";
    flagSpan.textContent = c.flag;
    var nameSpan = document.createElement("span");
    nameSpan.className = "card-country";
    nameSpan.textContent = " " + c.name;
    left.appendChild(flagSpan);
    left.appendChild(nameSpan);

    var statusSpan = document.createElement("span");
    statusSpan.className = "card-status";
    statusSpan.style.background = statusBg[c.status];
    statusSpan.style.color = statusColors[c.status];
    statusSpan.textContent = statusLabels[c.status];

    header.appendChild(left);
    header.appendChild(statusSpan);
    card.appendChild(header);

    var details = document.createElement("div");
    details.className = "card-details";
    details.appendChild(createDetailRow("Regulator", c.regulator));
    details.appendChild(createDetailRow("Market Size", c.market_size));
    details.appendChild(createDetailRow("Online Share", c.online_share));
    details.appendChild(createDetailRow("Tax", c.tax));
    details.appendChild(createDetailRow("License Cost", c.license_cost));
    card.appendChild(details);

    var badge = document.createElement("div");
    badge.className = "spribe-badge";
    badge.style.background = "rgba(" + (c.spribe === "high" ? "0,229,255" : c.spribe === "medium" ? "255,152,0" : c.spribe === "blocked" ? "239,83,80" : "255,255,255") + ",0.2)";
    badge.style.color = spribeColors[c.spribe];
    badge.textContent = spribeLabels[c.spribe] + ": " + c.spribe_note;
    card.appendChild(badge);

    var notes = document.createElement("div");
    notes.className = "card-notes";
    notes.textContent = c.notes;
    card.appendChild(notes);

    grid.appendChild(card);
  });
}

renderStats();
renderFilters();
renderGrid("all");
</script>
</body>
</html>
